<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NewApps</title>

<style>

*{
    box-sizing:border-box;
}

body{
    background:#000;
    color:#99ff00;
    font-family:Consolas,"Courier New",monospace;
    max-width:1200px;
    margin:auto;
    padding:40px;
}

h1{
    text-align:center;
    letter-spacing:6px;
    border-bottom:1px solid #333;
    padding-bottom:20px;
}

a{
    color:#99ff00;
    text-decoration:none;
}
a:hover{
    color:#ffaa00;
}

/* ================================================================
   PASSWORD LOCK SCREEN (same pattern as Acquarelles)
   ================================================================ */
#lockScreen{
    max-width:400px;
    margin:120px auto;
    text-align:center;
}
#lockScreen input{
    background:#111;
    color:#99ff00;
    border:1px solid #333;
    font-family:inherit;
    padding:10px;
    font-size:15px;
    width:200px;
    text-align:center;
}
#lockScreen button{
    background:#111;
    color:#99ff00;
    border:1px solid #333;
    font-family:inherit;
    padding:10px 16px;
    font-size:15px;
    cursor:pointer;
    margin-left:8px;
}
#lockScreen button:hover{
    border-color:#ffaa00;
    color:#ffaa00;
}
#lockError{
    color:#ff5555;
    margin-top:14px;
    min-height:1.2em;
}

#pageContent{
    display:none;
    text-align:center;
    margin-top:60px;
}

.placeholderBox{
    border:1px dashed #333;
    padding:60px 20px;
    margin:40px auto;
    max-width:700px;
    color:#777;
}

.backToMain{
    display:inline-block;
    margin-top:30px;
}

/* ================================================================
   HAMBURGER SIDEBAR NAV
   ================================================================ */
#hamburgerBtn{
    position:fixed;
    top:16px;
    left:16px;
    z-index:200;
    background:#111;
    color:#99ff00;
    border:1px solid #333;
    font-family:inherit;
    font-size:22px;
    padding:6px 12px;
    cursor:pointer;
}
#hamburgerBtn:hover{
    border-color:#ffaa00;
    color:#ffaa00;
}
#sidebar{
    position:fixed;
    top:0; left:0;
    height:100%;
    width:240px;
    background:#0a0a0a;
    border-right:1px solid #333;
    transform:translateX(-100%);
    transition:transform 0.25s ease;
    z-index:199;
    padding:70px 20px 20px 20px;
}
#sidebar.open{
    transform:translateX(0);
}
#sidebar a{
    display:block;
    padding:10px 0;
    border-bottom:1px solid #222;
    font-size:15px;
}
#sidebar a.lastItem{
    margin-top:20px;
    color:#ffaa00;
}
#sidebarOverlay{
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background:rgba(0,0,0,0.6);
    z-index:198;
    display:none;
}
#sidebarOverlay.open{
    display:block;
}

</style>

</head>

<body>

<!-- ============================================================
     LOCK SCREEN
     ============================================================ -->
<div id="lockScreen">
    <h1>NewApps</h1>
    <p>This page is password protected.</p>
    <div>
        <input type="password" id="passwordInput" placeholder="password" autocomplete="off">
        <button onclick="checkPassword()">Enter</button>
    </div>
    <div id="lockError"></div>
    <a class="backToMain" href="../index.html">&larr; Back to main</a>
</div>

<!-- ============================================================
     PROTECTED CONTENT
     Placeholder for now -- reserved for a future video-based
     creative app (similar spirit to Stencilize, but for moving
     images). Not built yet; this page just serves the slot.
     ============================================================ -->
<div id="pageContent">

    <button id="hamburgerBtn" onclick="toggleSidebar()">&#9776;</button>
    <div id="sidebarOverlay" onclick="closeSidebar()"></div>
    <nav id="sidebar">
        <a href="../index.html">Main page</a>
        <a href="../acquarelles/index.html">Acquarelles</a>
        <a href="../newapps/index.html">NewApps</a>
        <a href="../cvdemo/index.html">CV demo</a>
        <a href="../archive/index.html">Archive</a>
        <a class="lastItem" href="https://devmansworld.github.io/stencilize/">Try Stencilize app</a>
    </nav>

    <h1>NewApps</h1>

    <div class="placeholderBox">
        Coming soon: a video-based creative app.
    </div>

    <a class="backToMain" href="../index.html">&larr; Back to main</a>

</div>

<script>
/* ================================================================
   PASSWORD GATE
   Same mechanism as Acquarelles, just a different hardcoded
   password. Copy this whole block (HTML lock screen + this
   script) onto any future protected page and change only
   correctPassword.
   ================================================================ */
const correctPassword = "danke";

function checkPassword(){
    let entered = document.getElementById("passwordInput").value;
    if(entered === correctPassword){
        document.getElementById("lockScreen").style.display = "none";
        document.getElementById("pageContent").style.display = "block";
    } else {
        document.getElementById("lockError").innerText = "Incorrect password.";
    }
}

document.getElementById("passwordInput").addEventListener("keydown", function(e){
    if(e.key === "Enter") checkPassword();
});

function toggleSidebar(){
    document.getElementById("sidebar").classList.toggle("open");
    document.getElementById("sidebarOverlay").classList.toggle("open");
}
function closeSidebar(){
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("sidebarOverlay").classList.remove("open");
}
</script>

</body>
</html>
