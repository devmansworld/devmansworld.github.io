name: ARIGATO Stable — validate launch page

on:
  push:
    branches: [master]
    paths:
      - "stable/**"
      - "agenda/current/**"
      - ".nojekyll"
      - ".github/workflows/agenda-stable-index.yml"
  pull_request:
    branches: [master]
    paths:
      - "stable/**"
      - "agenda/current/**"
      - ".nojekyll"
      - ".github/workflows/agenda-stable-index.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate ARIGATO launch and agenda
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Smoke-test Stable page and embedded agenda
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path("stable/index.html")
          agenda = Path("agenda/current/index.html")
          assert page.is_file(), "stable/index.html is missing"
          assert agenda.is_file(), "agenda/current/index.html is missing"
          source = page.read_text(encoding="utf-8")
          app = agenda.read_text(encoding="utf-8")
          assert "<title>ARIGATO" in source, "ARIGATO page title is missing"
          assert '../agenda/current/' in source, "Stable page does not point to the current agenda"
          assert '<iframe' in source, "Embedded agenda iframe is missing"
          assert 'id="calendar"' in app or "FullCalendar" in app, "Agenda calendar markup/library is missing"
          assert Path(".nojekyll").is_file(), ".nojekyll is missing"
          print("ARIGATO Stable page and current agenda are present.")
          PY
