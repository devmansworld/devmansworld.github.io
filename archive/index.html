<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archive</title>

<style>

*{
    box-sizing:border-box;
}

body{
    background:#000;
    color:#99ff00;
    font-family:Consolas,"Courier New",monospace;
    max-width:1200px;
    margin:auto;
    padding:40px;
}

h1{
    text-align:center;
    letter-spacing:6px;
    border-bottom:1px solid #333;
    padding-bottom:20px;
}

p.note{
    color:#777;
    text-align:center;
}

a{
    color:#99ff00;
    text-decoration:none;
}
a:hover{
    color:#ffaa00;
}

/* ================================================================
   GALLERY
   Old, previously un-indexed images gathered from the repo root.
   Same square-tile treatment as the main gallery for consistency.
   ================================================================ */
.gallery{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
    margin-top:20px;
}
.gallery .tile{
    aspect-ratio:1/1;
    overflow:hidden;
    border:1px solid #333;
}
.gallery .tile:hover{
    border-color:#ffaa00;
}
.gallery .tile img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

@media(max-width:900px){
    .gallery{ grid-template-columns:repeat(3,1fr); }
}
@media(max-width:600px){
    .gallery{ grid-template-columns:repeat(2,1fr); }
}

.backToMain{
    display:inline-block;
    margin-top:30px;
}

/* ================================================================
   HAMBURGER SIDEBAR NAV (same pattern as every page)
   ================================================================ */
#hamburgerBtn{
    position:fixed;
    top:16px;
    left:16px;
    z-index:200;
    background:#111;
    color:#99ff00;
    border:1px solid #333;
    font-family:inherit;
    font-size:22px;
    padding:6px 12px;
    cursor:pointer;
}
#hamburgerBtn:hover{
    border-color:#ffaa00;
    color:#ffaa00;
}
#sidebar{
    position:fixed;
    top:0; left:0;
    height:100%;
    width:240px;
    background:#0a0a0a;
    border-right:1px solid #333;
    transform:translateX(-100%);
    transition:transform 0.25s ease;
    z-index:199;
    padding:70px 20px 20px 20px;
}
#sidebar.open{
    transform:translateX(0);
}
#sidebar a{
    display:block;
    padding:10px 0;
    border-bottom:1px solid #222;
    font-size:15px;
}
#sidebar a.lastItem{
    margin-top:20px;
    color:#ffaa00;
}
#sidebarOverlay{
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background:rgba(0,0,0,0.6);
    z-index:198;
    display:none;
}
#sidebarOverlay.open{
    display:block;
}

</style>

</head>

<body>

<button id="hamburgerBtn" onclick="toggleSidebar()">&#9776;</button>
<div id="sidebarOverlay" onclick="closeSidebar()"></div>
<nav id="sidebar">
    <a href="../index.html">Main page</a>
    <a href="../acquarelles/index.html">Acquarelles</a>
    <a href="../newapps/index.html">NewApps</a>
    <a href="../cvdemo/index.html">CV demo</a>
    <a href="../archive/index.html">Archive</a>
    <a class="lastItem" href="https://devmansworld.github.io/stencilize/">Try Stencilize app</a>
</nav>

<h1>Archive</h1>
<p class="note">Older images from the repository, not otherwise linked anywhere on the site. Public, no password.</p>

<div class="gallery" id="galleryGrid"></div>

<a class="backToMain" href="../index.html">&larr; Back to main</a>

<script>
/* ================================================================
   ARCHIVE IMAGE LIST
   Every file here lives at the repository root (one level up from
   this /archive/ folder) and was not referenced by any other page
   on the site -- gathered together so nothing gets lost.
   Duplicate files (same image saved twice under different names)
   were removed; only one copy of each is listed.
   ================================================================ */

];

function renderGallery(){
    let grid = document.getElementById("galleryGrid");
    grid.innerHTML = "";
    archiveImages.forEach(function(src){
        let tile = document.createElement("div");
        tile.className = "tile";
        let img = document.createElement("img");
        img.src = src;
        img.alt = "";
        tile.appendChild(img);
        grid.appendChild(tile);
    });
}
renderGallery();

function toggleSidebar(){
    document.getElementById("sidebar").classList.toggle("open");
    document.getElementById("sidebarOverlay").classList.toggle("open");
}
function closeSidebar(){
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("sidebarOverlay").classList.remove("open");
}
</script>

</body>
</html>
